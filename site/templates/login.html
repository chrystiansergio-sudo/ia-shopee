{% extends "base.html" %}{% block titulo %}Entrar{% endblock %}
{% block corpo %}
<main class="acesso">
  <img class="robo-grande" src="{{ url_for('robo_svg') }}" alt="Robô IA Shopee">
  <h1>IA Shopee</h1><p class="ajuda">Packs de vídeos de achadinhos</p>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="aviso {{ cat }}" role="alert">{{ msg }}</div>{% endfor %}
  <form method="post" class="cartao">
    <input type="hidden" name="_csrf" value="{{ csrf() }}">
    <label>Senha <input name="senha" type="password" autocomplete="current-password" required autofocus></label>
    <button class="btn primario grande">Entrar</button>
  </form>
</main>
{% endblock %}
